; PHP 8.2-FPM 站点 pool 片段
; 可并入 /etc/php/8.2/fpm/pool.d/www.conf 或复制为独立 pool
; 重启：sudo systemctl restart php8.2-fpm

php_admin_flag[display_errors] = off
php_admin_flag[log_errors] = on
php_admin_flag[expose_php] = off
php_admin_value[memory_limit] = 128M
php_admin_value[max_execution_time] = 30
php_admin_value[date.timezone] = Asia/Shanghai
php_admin_value[default_charset] = UTF-8
; 显式指定 SSL CA bundle，解决部分发行版默认路径缺失导致的证书验证失败
php_admin_value[curl.cainfo] = /etc/ssl/certs/ca-certificates.crt
php_admin_value[openssl.cafile] = /etc/ssl/certs/ca-certificates.crt

; 推荐用环境变量注入 GitHub Token，避免写入站点文件
; env[GITHUB_TOKEN] = ghp_xxxxxxxxxxxxxxxxxxxx
