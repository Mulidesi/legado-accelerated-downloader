# Apache 2.4 + PHP 8.2 虚拟主机示例
# 用法：
# 1. 将 YOUR_DOMAIN 和 /var/www/legado 替换为实际值
# 2. 启用：sudo a2enmod rewrite headers ssl
# 3. sudo cp deploy/apache-vhost.conf /etc/apache2/sites-available/legado.conf
# 4. sudo a2ensite legado && sudo apache2ctl configtest && sudo systemctl reload apache2

<VirtualHost *:80>
    ServerName YOUR_DOMAIN
    DocumentRoot /var/www/legado

    <Directory /var/www/legado>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
        DirectoryIndex index.php
    </Directory>

    <Directory /var/www/legado/data>
        Require all denied
    </Directory>

    <Directory /var/www/legado/includes>
        Require all denied
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/legado-error.log
    CustomLog ${APACHE_LOG_DIR}/legado-access.log combined
</VirtualHost>
