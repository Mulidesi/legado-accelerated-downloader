# Nginx + PHP 8.2-FPM 站点配置
# 用法：
# 1. 将 YOUR_DOMAIN 和 /var/www/legado 替换为实际值
# 2. sudo cp deploy/nginx.conf /etc/nginx/sites-available/legado
# 3. sudo ln -s /etc/nginx/sites-available/legado /etc/nginx/sites-enabled/legado
# 4. sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    listen [::]:80;
    server_name YOUR_DOMAIN;

    root /var/www/legado;
    index index.php;

    charset utf-8;
    client_max_body_size 8m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    location = /health {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.2-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ ^/(data|includes)/ {
        deny all;
        return 403;
    }

    location ~ /\. {
        deny all;
        return 404;
    }

    location ~* \.(json|log|ini)$ {
        deny all;
        return 403;
    }

    location ~ \.php$ {
        try_files $uri =404;
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.2-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_hide_header X-Powered-By;
    }

    location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|webp|woff2|webmanifest)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        access_log off;
        try_files $uri =404;
    }

    location = /sw.js {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }
}
