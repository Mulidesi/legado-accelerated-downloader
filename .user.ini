; PHP 8.2 / PHP-FPM 站点覆盖配置
; Apache + php-fpm 会读取此文件；Nginx 请同步到 php.ini 或 pool 配置

display_errors = Off
log_errors = On
expose_php = Off
default_charset = UTF-8
memory_limit = 128M
max_execution_time = 30
max_input_time = 30
post_max_size = 8M
upload_max_filesize = 8M
date.timezone = Asia/Shanghai
; 显式指定 SSL CA bundle，解决部分发行版默认路径缺失导致的证书验证失败
curl.cainfo = /etc/ssl/certs/ca-certificates.crt
openssl.cafile = /etc/ssl/certs/ca-certificates.crt
